# Nome exibido na aba Actions do GitHub.
name: CI - Build e Testes

# Eventos que iniciam este workflow.
on:
  # Executa quando há push para a branch principal.
  push:
    branches:
      - master

  # Executa ao abrir ou atualizar um pull request destinado à branch principal.
  pull_request:
    branches:
      - master

  # Permite iniciar o workflow manualmente pela aba Actions.
  workflow_dispatch:

# Tarefas executadas pelo workflow.
jobs:
  build-and-test:
    # Usa uma máquina Linux hospedada pelo GitHub.
    runs-on: ubuntu-latest

    # Etapas executadas em sequência dentro da tarefa.
    steps:
      # Baixa o conteúdo do repositório para a máquina do runner.
      - name: Baixar o código
        uses: actions/checkout@v4

      # Instala o SDK .NET usado pelo projeto.
      - name: Instalar o .NET 6
        uses: actions/setup-dotnet@v4
        with:
          # Mantém a versão compatível com os projetos que targetam net6.0.
          dotnet-version: 6.0.x

      # Restaura os pacotes da aplicação e do projeto de testes.
      - name: Restaurar dependências
        run: dotnet restore testecicd.Tests/testecicd.Tests.csproj

      # Compila o projeto de testes e a aplicação referenciada em modo Release.
      - name: Compilar
        run: dotnet build testecicd.Tests/testecicd.Tests.csproj --configuration Release --no-restore

      # Executa os testes já compilados; falhas fazem a tarefa falhar.
      - name: Executar testes
        run: dotnet test testecicd.Tests/testecicd.Tests.csproj --configuration Release --no-build --no-restore

      # Gera os arquivos publicados da aplicação Blazor.
      - name: Publicar aplicação
        run: dotnet publish testecicd/testecicd.csproj --configuration Release --no-restore --output ./publish

      # Disponibiliza os arquivos publicados para o job que executa no IIS.
      - name: Armazenar pacote publicado
        uses: actions/upload-artifact@v4
        with:
          name: testecicd-publish
          path: publish/
          if-no-files-found: error
          retention-days: 1

  deploy-iis:
    # Só inicia depois que build, testes e publicação passam.
    needs: build-and-test
    # Publica somente quando a branch executada é master.
    if: github.ref == 'refs/heads/master'
    # Executa no runner Windows x64 instalado na máquina do IIS.
    runs-on: [self-hosted, windows, x64]
    steps:
      # Baixa os arquivos gerados pelo job build-and-test.
      - name: Baixar pacote publicado
        uses: actions/download-artifact@v4
        with:
          name: testecicd-publish
          path: ${{ runner.temp }}\testecicd-publish

      # Coloca apenas esta aplicação em manutenção enquanto os arquivos são copiados.
      - name: Publicar no IIS
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $publishPath = Join-Path $env:RUNNER_TEMP 'testecicd-publish'
          $sitePath = 'C:\inetpub\testecicd'
          $offlinePath = Join-Path $sitePath 'app_offline.htm'

          if (-not (Test-Path $publishPath)) {
            throw "Pacote publicado não encontrado: $publishPath"
          }

          if (-not (Test-Path $sitePath)) {
            throw "Pasta física do site não encontrada: $sitePath"
          }

          Set-Content -Path $offlinePath -Value '<html><body>Publicação em andamento.</body></html>' -Encoding UTF8

          try {
            Start-Sleep -Seconds 5
            & robocopy $publishPath $sitePath /E /COPY:DAT /DCOPY:DAT /R:2 /W:2
            $copyExitCode = $LASTEXITCODE

            if ($copyExitCode -ge 8) {
              throw "Robocopy falhou com código $copyExitCode."
            }
          }
          finally {
            Remove-Item -Path $offlinePath -Force -ErrorAction SilentlyContinue
          }


